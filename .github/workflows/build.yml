name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build UltraLightRgb.sln -c Release
      - name: Test
        run: dotnet test UltraLightRgb.sln -c Release --no-build
      - name: Package
        shell: pwsh
        run: ./deploy/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: UltraLightRgb-win-x64
          path: dist/*.zip
